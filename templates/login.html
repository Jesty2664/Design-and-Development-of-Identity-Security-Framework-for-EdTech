{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 min-h-[80vh] flex flex-col justify-center">
    
    <div class="reveal-on-scroll text-center mb-12" style="opacity: 1; transform: none;">
        <h1 class="text-5xl font-academic font-bold text-white uppercase tracking-tighter mb-2">ACCESS_PORTAL</h1>
        <p class="text-[10px] font-tactical text-cyber-indigo uppercase tracking-[0.4em]">Initialize Neural Handshake</p>
    </div>

    <!-- Login Enclave -->
    <div class="cyber-glass p-10 edge-lit reveal-on-scroll">
        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="space-y-4">
                <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest ml-1">Credential_ID</label>
                <input name="email" type="email" required placeholder="name@yenepoya.edu.in" 
                    class="magic-input focus:ring-1 focus:ring-cyber-indigo/50">
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center px-1">
                    <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest">Safety_Cipher</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-[9px] font-tactical text-cyber-indigo/40 hover:text-cyber-indigo transition-colors uppercase">Lost_Key?</a>
                </div>
                <div class="relative">
                    <input name="password" id="login_password" type="password" required placeholder="••••••••••••" 
                        class="magic-input focus:ring-1 focus:ring-cyber-indigo/50 pr-12">
                    <button type="button" onclick="togglePassword('login_password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-cyber-indigo transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full btn-magnetic py-4 text-xs tracking-[0.2em] font-bold uppercase transition-all">
                Enter Nexus
            </button>
        </form>

        <!-- Google SSO Token -->
        <div class="mt-8 border-t border-white/5 pt-8">
            <a href="{{ url_for('auth.google_login') }}" class="w-full cyber-glass py-3 px-4 text-[10px] font-academic font-bold text-white/80 hover:text-cyber-indigo hover:border-cyber-indigo/40 transition-all flex items-center justify-center gap-3 uppercase tracking-widest magic-press">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#6366F1"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#10B981"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#F59E0B"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EF4444"/></svg>
                Sync Google Node
            </a>
        </div>

        <!-- Biometric Sentinel Access -->
        <div class="mt-12 pt-10 border-t border-white/5">
            <h4 class="text-[9px] font-tactical font-bold text-gray-600 text-center uppercase tracking-[0.5em] mb-8">Biometric_Sentinel_Access</h4>
            <div class="grid grid-cols-1 max-w-xs mx-auto">
                <button id="webauthn-login-passkey" onclick="handleBiometricLogin('passkey')" 
                    class="cyber-glass py-4 px-4 text-[9px] font-academic font-bold text-cyber-indigo/80 hover:text-cyber-indigo hover:border-cyber-indigo/40 transition-all flex items-center justify-center gap-3 uppercase tracking-widest magic-press shadow-[0_0_20px_rgba(99,102,241,0.1)]">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyber-indigo animate-pulse"></span>
                    Handshake: Passkey
                </button>
            </div>
            
            <div id="webauthn-log" class="mt-6 frost-log hidden h-16 overflow-y-auto ghost-scroll text-[8px]">
                >> Awaiting hardware attestation...
            </div>
        </div>
    </div>

    <!-- Registration Link -->
    <div class="mt-10 text-center reveal-on-scroll">
        <p class="text-[10px] font-tactical text-gray-500 uppercase tracking-widest">
            New Operative? <a href="{{ url_for('auth.register') }}" class="text-cyber-indigo hover:underline decoration-cyber-indigo decoration-2 underline-offset-4 font-bold ml-2">Enroll_Now</a>
        </p>
    </div>

</div>

<!-- Dependency Script for WebAuthn Handshake -->
<script src="{{ url_for('static', filename='webauthn.js') }}"></script>

<!-- Dependency Script for WebAuthn Handshake -->
<script src="{{ url_for('static', filename='webauthn.js') }}"></script>
{% endblock %}
