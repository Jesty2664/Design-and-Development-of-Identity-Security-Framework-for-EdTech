{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 min-h-[80vh] flex flex-col justify-center">
    
    <div class="reveal-on-scroll text-center mb-12">
        <h1 class="text-5xl font-academic font-bold text-white uppercase tracking-tighter mb-2">NEURAL_RESET</h1>
        <p class="text-[10px] font-tactical text-cyber-indigo uppercase tracking-[0.4em]">Synchronize_New_Cipher</p>
    </div>

    <!-- Reset Enclave -->
    <div class="cyber-glass p-10 edge-lit reveal-on-scroll">
        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST" class="space-y-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <p class="text-[11px] font-academic text-gray-400 mb-6 leading-relaxed">
                Tokens validated. Authenticated session for <span class="text-cyber-indigo font-bold">Node_Recovery</span> is active. Define your new safety cipher below.
            </p>

            <div class="space-y-4">
                <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest ml-1">New_Safety_Cipher</label>
                <div class="relative">
                    <input name="password" id="reset_password" type="password" required placeholder="••••••••••••" 
                        class="magic-input focus:ring-1 focus:ring-cyber-indigo/50 pr-12">
                    <button type="button" onclick="togglePassword('reset_password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-cyber-indigo transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest ml-1">Confirm_Cipher</label>
                <input name="confirm_password" type="password" required placeholder="••••••••••••" 
                    class="magic-input focus:ring-1 focus:ring-cyber-indigo/50">
            </div>

            <button type="submit" class="w-full btn-magnetic py-4 text-xs tracking-[0.2em] font-bold uppercase transition-all">
                Synchronize_Cipher
            </button>
        </form>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
    } else {
        input.type = 'password';
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
}
</script>
{% endblock %}
