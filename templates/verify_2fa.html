{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12 relative">
    
    <div class="max-w-md w-full relative">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-academic font-bold text-white uppercase tracking-tighter mb-2">IDENTITY_CHALLENGE</h1>
            <p class="text-[10px] font-tactical text-solar/60 uppercase tracking-[0.4em]">Possession Verification</p>
        </div>

        <div class="frost-panel relative z-10 text-center p-10 shadow-2xl">
            <p class="text-[10px] font-academic text-gray-400 uppercase tracking-widest mb-10">Enter the 6-digit sync fragment from your device.</p>

            <form action="{{ url_for('auth.verify_2fa') }}" method="POST" class="space-y-8">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="group">
                    <label class="block text-[10px] font-tactical font-bold text-gray-500 uppercase tracking-widest mb-4 group-focus-within:text-solar transition-colors">Sync_Fragment</label>
                    <input name="totp_code" type="text" maxlength="6" required autofocus 
                        class="w-full bg-solar/5 border border-solar/20 p-6 text-4xl text-center font-tactical text-white tracking-[0.5em] focus:outline-none focus:border-solar focus:ring-1 focus:ring-solar/50 transition-all" 
                        placeholder="000000">
                </div>

                <div class="group">
                    <label class="block text-[10px] font-tactical font-bold text-gray-500 uppercase tracking-widest mb-4 group-focus-within:text-solar transition-colors">Analog_Backup_Fragment</label>
                    <input name="backup_code" type="text" maxlength="64"
                        class="w-full bg-solar/5 border border-white/10 p-2 text-sm text-center font-tactical text-gray-400 tracking-[0.2em] focus:outline-none focus:border-solar transition-all" 
                        placeholder="Optional">
                </div>

                <button type="submit" class="w-full btn-solar py-4 text-sm tracking-[0.2em]">
                    Validate Fragment
                </button>
            </form>

            <div class="mt-10 pt-8 border-t border-white/5 space-y-4">
                <p class="text-[9px] font-academic text-gray-500 uppercase tracking-widest leading-relaxed">
                    Device out of sync? Use an emergency shard.
                </p>
                <div class="flex gap-4">
                    <a href="{{ url_for('auth.recover_account') }}" class="flex-1 py-3 text-solar/60 font-tactical font-bold text-[9px] hover:text-solar transition-colors border border-solar/20 hover:bg-solar/5 uppercase tracking-widest">
                        Emergency_Recovery
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
