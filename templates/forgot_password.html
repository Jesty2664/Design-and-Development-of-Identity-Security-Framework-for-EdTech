{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 min-h-[80vh] flex flex-col justify-center">
    
    <div class="reveal-on-scroll text-center mb-12">
        <h1 class="text-5xl font-academic font-bold text-white uppercase tracking-tighter mb-2">RECOVERY_PORTAL</h1>
        <p class="text-[10px] font-tactical text-cyber-indigo uppercase tracking-[0.4em]">Lost_Key_Restoration</p>
    </div>

    <!-- Recovery Enclave -->
    <div class="cyber-glass p-10 edge-lit reveal-on-scroll">
        <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <p class="text-[11px] font-academic text-gray-400 mb-6 leading-relaxed">
                Enter your registered <span class="text-cyber-indigo font-bold">Credential_ID</span>. If the identity exists in the mesh, a neural restoration link will be transmitted to your terminal.
            </p>

            <div class="space-y-4">
                <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest ml-1">Credential_ID (Email)</label>
                <input name="email" type="email" required placeholder="name@yenepoya.edu.in" 
                    class="magic-input focus:ring-1 focus:ring-cyber-indigo/50">
            </div>

            <button type="submit" class="w-full btn-magnetic py-4 text-xs tracking-[0.2em] font-bold uppercase transition-all">
                Transmit_Reset_Link
            </button>
        </form>

        <div class="mt-8 border-t border-white/5 pt-8 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-[9px] font-tactical text-cyber-indigo/60 hover:text-cyber-indigo transition-colors uppercase tracking-widest">
                Return_to_Nexus
            </a>
        </div>
    </div>
</div>
{% endblock %}
