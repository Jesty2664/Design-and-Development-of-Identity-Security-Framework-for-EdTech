{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 min-h-[80vh] flex flex-col justify-center">
    
    <div class="reveal-on-scroll text-center mb-12">
        <h1 class="text-5xl font-academic font-bold text-white uppercase tracking-tighter mb-2">FINAL_SYNC</h1>
        <p class="text-[10px] font-tactical text-cyber-indigo uppercase tracking-[0.4em]">Identity_Restoration_Authorized</p>
    </div>

    <!-- Final Reset Enclave -->
    <div class="cyber-glass p-10 edge-lit reveal-on-scroll shadow-[0_0_50px_rgba(99,102,241,0.1)]">
        <p class="text-[11px] font-academic text-gray-400 mb-10 leading-relaxed text-center">
            Multi-vector handshakes complete. You are now authorized to define a new safety cipher for your profile.
        </p>

        <form action="{{ url_for('auth.reset_password_final') }}" method="POST" class="space-y-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="space-y-4">
                <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest ml-1">New_Safety_Cipher</label>
                <div class="relative">
                    <input name="password" id="reset_password_manual" type="password" required placeholder="••••••••••••" 
                        class="magic-input focus:ring-1 focus:ring-cyber-indigo/50 pr-12">
                    <button type="button" onclick="togglePassword('reset_password_manual', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-cyber-indigo transition-colors font-tactical text-[9px]">
                        👁️
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <label class="block text-[10px] font-academic font-bold text-gray-400 uppercase tracking-widest ml-1">Confirm_New_Cipher</label>
                <input name="confirm_password" type="password" required placeholder="••••••••••••" 
                    class="magic-input focus:ring-1 focus:ring-cyber-indigo/50">
            </div>

            <button type="submit" class="w-full btn-magnetic py-4 text-xs tracking-[0.2em] font-bold uppercase transition-all">
                Synchronize_Identity
            </button>
        </form>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
    } else {
        input.type = 'password';
    }
}
</script>
{% endblock %}
