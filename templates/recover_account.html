{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 py-20 relative">
    
    <div class="text-center mb-16">
        <h1 class="text-4xl font-academic font-bold text-white uppercase tracking-tighter mb-2">ENTROPY_RECONSTRUCTION</h1>
        <p class="text-[10px] font-tactical text-solar/60 uppercase tracking-[0.4em]">Shamir Protocol V4</p>
    </div>

    <div class="grid md:grid-cols-2 gap-12 items-center">
        <!-- Visuals -->
        <div class="frost-panel p-8 shadow-2xl relative">
            <h3 class="text-[10px] font-academic font-bold text-solar uppercase tracking-widest mb-6">Reconstruct_ID</h3>
            <p class="text-[10px] font-academic text-gray-400 leading-relaxed mb-8">
                Provide at least 2 fragmented identity shards to reconstruct your security enclave.
            </p>

            <!-- Shamir Prism Projection -->
            <div class="p-12 bg-black/20 border border-white/5 relative overflow-hidden group">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(34,211,238,0.1)_0%,transparent_70%)]"></div>
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-24 h-24 border-2 border-solar/20 flex items-center justify-center animate-[spin_10s_linear_infinite]">
                        <div class="w-16 h-16 border border-solar animate-[pulse_2s_infinite]"></div>
                    </div>
                    <div id="reconstruction-status" class="mt-8 text-[9px] font-tactical text-solar animate-pulse uppercase tracking-[0.2em]">
                        WAITING_FOR_SHARDS...
                    </div>
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="frost-panel p-8">
            <h3 class="text-xs font-academic font-bold text-white uppercase tracking-widest mb-8 border-l-4 border-solar pl-4">
                Shard_Collection
            </h3>

            <form action="{{ url_for('auth.recover_account') }}" method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="group">
                    <label class="block text-[10px] font-tactical font-bold text-gray-500 uppercase tracking-widest mb-2 group-focus-within:text-solar transition-colors">Credential_ID</label>
                    <input name="email" type="email" required class="cyber-input focus:ring-1 focus:ring-solar/50" placeholder="user@identity.edu">
                </div>

                <div class="space-y-4">
                    <div class="group">
                        <label class="block text-[10px] font-tactical font-bold text-gray-500 uppercase tracking-widest mb-2">Shard_Alpha</label>
                        <input name="shard1" type="text" required class="cyber-input focus:ring-1 focus:ring-solar/50" placeholder="FRAGMENT_LAYER_1">
                    </div>
                    
                    <div class="group">
                        <label class="block text-[10px] font-tactical font-bold text-gray-500 uppercase tracking-widest mb-2">Shard_Beta</label>
                        <input name="shard2" type="text" class="cyber-input focus:ring-1 focus:ring-solar/50" placeholder="FRAGMENT_LAYER_2 (OPTIONAL_IF_3_LOADED)">
                    </div>
                </div>

                <button type="submit" class="w-full btn-solar py-4 mt-4 text-sm tracking-[0.2em]">
                    Reconstruct Enclave
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="{{ url_for('auth.login') }}" class="text-[9px] font-tactical font-bold text-gray-500 hover:text-white transition-colors uppercase tracking-widest">
                    Abort_Reconstruction
                </a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
