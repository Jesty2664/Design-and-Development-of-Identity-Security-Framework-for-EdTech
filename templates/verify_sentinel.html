{% extends "base.html" %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-20 relative">
    
    <div class="max-w-xl w-full relative">

        <div class="frost-panel p-10 shadow-2xl relative z-10 text-center">
            <!-- Holographic Scanner Animation -->
            <div class="nexus-scanner"></div>

            <div class="mb-10 text-center">
                <h1 class="text-3xl font-academic font-bold text-white uppercase tracking-tighter mb-2">SENTINEL_SCAN</h1>
                <p class="text-[10px] font-tactical text-solar/60 uppercase tracking-widest">Awaiting hardware bound signature verification.</p>
            </div>

            <!-- Scanner Visual -->
            <div class="relative group mb-12">
                <div class="absolute inset-0 bg-solar/5 blur-xl group-hover:bg-solar/10 transition-all"></div>
                <div class="relative bg-black/40 border border-white/5 p-12 flex flex-col items-center justify-center overflow-hidden rounded">
                    <!-- Scanner Beam Graphic -->
                    <div class="w-full h-px bg-solar shadow-[0_0_15px_#22d3ee] absolute top-1/2 left-0 animate-[scan_3s_linear_infinite]"></div>
                    
                    <svg class="w-24 h-24 text-solar opacity-40 group-hover:opacity-100 transition-opacity mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-3.44A20.01 20.01 0 0110 21.01m7.243-7.243a20.01 20.01 0 00-7.243-7.243m7.243 7.243L19 21m-7.243-7.243a20.01 20.01 0 01-7.243-7.243M7.243 7.243L5 3m7.243 4.243L12 3m7.243 4.243L21 3"></path>
                    </svg>
                    
                    <div id="status-terminal" class="text-[10px] font-tactical text-gray-500 uppercase tracking-widest">
                        [SYS] Ready for hardware_vector...
                    </div>
                </div>
            </div>

            <form id="sentinel-form" class="space-y-6">
                <!-- Data placeholders -->
                <input type="hidden" id="challenge" value="{{ challenge }}">
                
                <button type="button" onclick="verifySentinel()" id="verify-btn" 
                    class="w-full btn-solar py-5 text-sm tracking-[0.2em]">
                    Initiate Sentinel Handshake
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <a href="{{ url_for('auth.verify_2fa') }}" class="text-[9px] font-tactical font-bold text-gray-500 hover:text-white transition-colors uppercase tracking-widest">
                    Fallback to Sync_Fragment
                </a>
            </div>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='webauthn.js') }}"></script>
<script>
    async function verifySentinel() {
        const btn = document.getElementById('verify-btn');
        const terminal = document.getElementById('status-terminal');
        
        btn.disabled = true;
        terminal.innerText = "[SYS] HANDSHAKE_INITIATED...";
        terminal.classList.add('text-solar');

        try {
            await handleBiometricLogin('passkey'); // Using new logic
        } catch (err) {
            console.error(err);
            terminal.innerText = "[SYS] ERROR: HARDWARE_VECTOR_FAILED";
            terminal.classList.replace('text-solar', 'text-red-500');
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
